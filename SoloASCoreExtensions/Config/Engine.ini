; Changes apply after restarting the editor or game process.
; Disabling features does not unload VM bindings or the plugin DLL in a running process.
[SoloASCoreExtensions]
; Feature switches default to enabled in code; set overrides in the project DefaultEngine.ini.
; BlueprintStructBindings are project settings in [SoloASCoreExtensions] in DefaultEngine.ini.
; Configure every nested UDS as well. Script names must be unique ASCII identifiers.
; +BlueprintStructBindings=(Name=FInventoryEntry,Path="/Game/Data/ST_InventoryEntry.ST_InventoryEntry")
; Editing a configured structure requires an editor restart; existing script values retain the previous layout.
