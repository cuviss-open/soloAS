name: Public checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 .github/scripts/check_public.py links
  licenses:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 .github/scripts/check_public.py licenses
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
